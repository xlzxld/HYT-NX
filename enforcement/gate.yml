name: gate
on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 按项目技术栈补充运行时安装，例如：
      #   - uses: actions/setup-node@v4
      #     with: { node-version: 20 }
      #   - uses: actions/setup-python@v5
      #     with: { python-version: "3.12" }
      - name: Install pre-commit & ruff
        # ruff 版本与本地门禁一致(0.16.6), 避免规则集漂移导致基线豁免失配
        run: pip install pre-commit "ruff==0.16.6"
      - name: Secrets scan (gitleaks, all files)
        run: pre-commit run --all-files
      - name: Verify (fmt-check / lint / test / build, 增量=本次改动文件)
        # 全仓存量基线问题已按 AGENTS.md §2 登记豁免, lint/fmt 仅查本 PR
        # 改动过的文件(merge-base 三点 diff), 不传 CHANGED 会撞存量致恒红
        run: make verify CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
